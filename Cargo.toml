[package]
name = "gray-tasks"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Merged task-tracking plugin for the gray agent harness: todo, kanban, goal in one sidecar."

[[bin]]
name = "tasks"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
